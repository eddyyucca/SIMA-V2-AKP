<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Alur karyawan baru: rencana kedatangan"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8aa4c2"/></marker></defs><rect width="1300" height="360" rx="14" fill="#ffffff"/><text x="28" y="38" font-size="20" font-weight="800" fill="#10264a">Alur karyawan baru: rencana kedatangan</text><text x="28" y="60" font-size="13" fill="#64748b">Barang disiapkan lebih dulu, lalu diserahkan saat karyawan datang</text><rect x="40" y="130" width="230" height="92" rx="12" fill="#fff" stroke="#b9d3ea" stroke-width="1.6"/><text x="155.0" y="163.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10264a">Rencana Kedatangan</text><text x="155.0" y="180.5" text-anchor="middle" font-size="12" fill="#64748b">tanggal, lokasi, department</text><text x="155.0" y="197.5" text-anchor="middle" font-size="12" fill="#64748b">daftar aset + accessories</text><rect x="330" y="130" width="230" height="92" rx="12" fill="#fdf3df" stroke="#f0d28c" stroke-width="1.6"/><text x="445.0" y="163.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8a5a0b">Barang dicadangkan</text><text x="445.0" y="180.5" text-anchor="middle" font-size="12" fill="#8a5a0b">Direncanakan &gt; Disiapkan &gt; Siap</text><text x="445.0" y="197.5" text-anchor="middle" font-size="12" fill="#8a5a0b">(stok tidak dipakai pihak lain)</text><rect x="620" y="130" width="200" height="92" rx="12" fill="#1f6fb5" stroke="#1f6fb5" stroke-width="1.6"/><text x="720.0" y="172.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">Hari kedatangan</text><text x="720.0" y="189.0" text-anchor="middle" font-size="12" fill="#dbeafe">serah terima</text><line x1="270" y1="176" x2="330" y2="176" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><line x1="560" y1="176" x2="620" y2="176" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><rect x="900" y="80" width="250" height="80" rx="12" fill="#e4f5f2" stroke="#9fd8cf" stroke-width="1.6"/><text x="1025.0" y="116.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17766b">BAST aset</text><text x="1025.0" y="133.0" text-anchor="middle" font-size="12" fill="#17766b">satu BAST per aset</text><rect x="900" y="200" width="250" height="80" rx="12" fill="#e4f5f2" stroke="#9fd8cf" stroke-width="1.6"/><text x="1025.0" y="236.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17766b">BAST accessories</text><text x="1025.0" y="253.0" text-anchor="middle" font-size="12" fill="#17766b">satu BAST untuk semua item</text><line x1="820" y1="160" x2="900" y2="124" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><line x1="820" y1="192" x2="900" y2="240" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><rect x="1190" y="150" width="90" height="52" rx="26.0" fill="#f1f4f9" stroke="#cfd8e6" stroke-width="1.6"/><text x="1235.0" y="180.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#475569">Selesai</text><line x1="1150" y1="120" x2="1210" y2="150" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><line x1="1150" y1="240" x2="1210" y2="202" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><text x="40" y="300" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">Rencana yang terlambat atau berisiko (7 hari ke depan) muncul sebagai peringatan di Dashboard.</text></svg>