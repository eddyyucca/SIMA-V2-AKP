<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 540" width="1300" height="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Alur scan QR dan label"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8aa4c2"/></marker></defs><rect width="1300" height="540" rx="14" fill="#ffffff"/><text x="28" y="38" font-size="20" font-weight="800" fill="#10264a">Alur scan QR dan label</text><text x="28" y="60" font-size="13" fill="#64748b">Label ditempel di aset; scan menampilkan data aset dan pemegangnya</text><rect x="40" y="170" width="230" height="80" rx="40.0" fill="#f1f4f9" stroke="#cfd8e6" stroke-width="1.6"/><text x="155.0" y="206.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#475569">Label QR di aset</text><text x="155.0" y="223.0" text-anchor="middle" font-size="12" fill="#64748b">pita 24 mm x 70 mm</text><rect x="360" y="160" width="230" height="100" rx="12" fill="#1f6fb5" stroke="#1f6fb5" stroke-width="1.6"/><text x="475.0" y="197.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">Scan</text><text x="475.0" y="214.5" text-anchor="middle" font-size="12" fill="#dbeafe">menu Scan QR di aplikasi</text><text x="475.0" y="231.5" text-anchor="middle" font-size="12" fill="#dbeafe">atau pemindai USB</text><line x1="270" y1="210" x2="360" y2="210" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="60" width="320" height="92" rx="12" fill="#fff" stroke="#b9d3ea" stroke-width="1.6"/><text x="860.0" y="93.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10264a">Kartu aset</text><text x="860.0" y="110.5" text-anchor="middle" font-size="12" fill="#64748b">kode, perangkat, serial,</text><text x="860.0" y="127.5" text-anchor="middle" font-size="12" fill="#64748b">status, kondisi, lokasi</text><rect x="700" y="180" width="320" height="92" rx="12" fill="#e4f5f2" stroke="#9fd8cf" stroke-width="1.6"/><text x="860.0" y="213.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17766b">Data pemegang</text><text x="860.0" y="230.5" text-anchor="middle" font-size="12" fill="#17766b">nama, NIK, department, jabatan,</text><text x="860.0" y="247.5" text-anchor="middle" font-size="12" fill="#17766b">BAST terakhir</text><rect x="700" y="300" width="320" height="72" rx="12" fill="#fff" stroke="#b9d3ea" stroke-width="1.6"/><text x="860.0" y="340.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10264a">Pintasan ke detail aset</text><line x1="590" y1="190" x2="700" y2="106" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><line x1="590" y1="210" x2="700" y2="226" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><line x1="590" y1="235" x2="700" y2="336" stroke="#8aa4c2" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="420" width="320" height="80" rx="12" fill="#fdecec" stroke="#efb4b4" stroke-width="1.6"/><text x="860.0" y="447.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b13a3a">Kode tidak ditemukan</text><text x="860.0" y="464.5" text-anchor="middle" font-size="12" fill="#b13a3a">muncul notifikasi;</text><text x="860.0" y="481.5" text-anchor="middle" font-size="12" fill="#b13a3a">tidak ada data yang berubah</text><polyline points="520,260 520,460 700,460" fill="none" stroke="#8aa4c2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" stroke-linejoin="round"/><rect x="430.5" y="388.5" width="179.0" height="21" rx="6" fill="#fff" fill-opacity="0.95"/><text x="520" y="402.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">bila kode tidak terdaftar</text><text x="1060" y="110" text-anchor="start" font-size="12.5" font-weight="700" fill="#10264a">Label accessories &amp; komponen:</text><text x="1060" y="130" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">pita 9 mm x 30 mm, teks &quot;PT. AKP&quot;</text><text x="1060" y="148" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">di samping QR, kode (ACC-0001)</text><text x="1060" y="166" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">di bawahnya. Consumable tidak dilabeli.</text></svg>