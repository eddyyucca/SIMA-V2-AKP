# Berkas statis (CSS/JS/font/gambar) di-cache browser & Cloudflare 7 hari: tanpa ini browser memeriksa ulang puluhan berkas lewat tunnel
# pada setiap halaman. URL aset Filament dan tema memakai ?v=<versi/waktu ubah>, jadi pembaruan tetap langsung terbaca.
<IfModule mod_headers.c>
    <FilesMatch "\.(css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
</IfModule>
