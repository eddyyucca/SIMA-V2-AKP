# CI/CD aplikasi ini (mandiri). Setiap push ke main: (1) GitHub membangun image dan mengunggahnya ke ghcr.io,
# (2) runner di server memanggil webhook Portainer supaya stack menarik image baru dan restart.
#
# Langkah 1 memakai GITHUB_TOKEN bawaan. Langkah 2 HANYA jalan bila variabel repo AUTO_DEPLOY = true (setelah runner terpasang di server):
#   gh variable set AUTO_DEPLOY --body true -R eddyyucca/SIMA-V2-AKP
#   Secret PORTAINER_WEBHOOK_URL = alamat webhook stack di Portainer (pakai localhost, runner berada di server yang sama)
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0'   # tiap Minggu 20:00 UTC: bangun ulang agar PHP terbaru ikut

env:
  IMAGE: akp-asset
  PHP_MIN: "8.3.36"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: akp_asset, POSTGRES_PASSWORD: akp_asset_dev, POSTGRES_DB: akp_asset_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U akp_asset" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_mysql, intl, zip, bcmath, gmp, gd, mbstring
          ini-values: memory_limit=1G
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Tes (PostgreSQL)
        run: vendor/bin/phpunit tests/Agent tests/Qa tests/Requisition

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - name: Pastikan PHP dasar sudah versi aman
        run: |
          docker pull php:8.3-apache
          docker run --rm -e PHP_MIN php:8.3-apache php -r 'echo PHP_VERSION, PHP_EOL; exit(version_compare(PHP_VERSION, getenv("PHP_MIN"), ">=") ? 0 : 1);'
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    runs-on: [self-hosted, windows, akp-server]
    steps:
      - name: Perbarui stack di Portainer
        shell: cmd
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          rem Portainer memakai sertifikat sendiri (https://localhost:9443): -k hanya untuk panggilan lokal ini. -f = gagal bila HTTP 4xx/5xx.
          curl.exe -k -sS -f --max-time 120 -X POST "%WEBHOOK%"
